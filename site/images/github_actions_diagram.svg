<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6773"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7B42BC"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="#f5f6f8"/>

  <!-- Row 1: PR flow -->
  <rect x="30" y="40" width="150" height="70" rx="8" fill="#24292e"/>
  <text x="105" y="70" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">GitHub Repo</text>
  <text x="105" y="90" text-anchor="middle" fill="#c9d1d9" font-size="12">push / pull request</text>

  <line x1="180" y1="75" x2="250" y2="75" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="40" width="160" height="70" rx="8" fill="#2088ff"/>
  <text x="330" y="70" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">GitHub Actions</text>
  <text x="330" y="90" text-anchor="middle" fill="#eaf4ff" font-size="12">plan / apply / deploy</text>

  <line x1="410" y1="75" x2="480" y2="75" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="40" width="160" height="70" rx="8" fill="#6f42c1"/>
  <text x="560" y="64" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">OIDC Token</text>
  <text x="560" y="82" text-anchor="middle" fill="#ece5f7" font-size="11">short-lived, per-run</text>
  <text x="560" y="98" text-anchor="middle" fill="#ece5f7" font-size="11">no stored keys</text>

  <line x1="640" y1="75" x2="710" y2="75" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="710" y="40" width="160" height="70" rx="8" fill="#ff9900"/>
  <text x="790" y="64" text-anchor="middle" fill="#232f3e" font-size="14" font-weight="bold">AWS IAM Role</text>
  <text x="790" y="82" text-anchor="middle" fill="#232f3e" font-size="11">scoped trust policy</text>
  <text x="790" y="98" text-anchor="middle" fill="#232f3e" font-size="11">assumed via STS</text>

  <!-- Down to Terraform -->
  <line x1="790" y1="110" x2="790" y2="170" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="170" width="220" height="60" rx="8" fill="#7B42BC"/>
  <text x="770" y="196" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">terraform plan / apply</text>
  <text x="770" y="216" text-anchor="middle" fill="#eee6fb" font-size="11">state in S3, native lock</text>

  <line x1="660" y1="200" x2="410" y2="200" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="170" width="180" height="60" rx="8" fill="#232f3e"/>
  <text x="320" y="196" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">aws s3 sync</text>
  <text x="320" y="216" text-anchor="middle" fill="#d7dde3" font-size="11">site files -&gt; S3 bucket</text>

  <!-- Down to grouped resource boxes -->
  <line x1="770" y1="230" x2="770" y2="270" stroke="#7B42BC" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-purple)"/>
  <line x1="320" y1="230" x2="320" y2="270" stroke="#5c6773" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Left box: content-sync target -->
  <rect x="170" y="270" width="300" height="80" rx="8" fill="#ffffff" stroke="#5c6773" stroke-width="2"/>
  <text x="320" y="294" text-anchor="middle" fill="#232f3e" font-size="13" font-weight="bold">S3 Bucket</text>
  <text x="320" y="316" text-anchor="middle" fill="#5c6773" font-size="11">site content synced here</text>
  <text x="320" y="334" text-anchor="middle" fill="#5c6773" font-size="11">on every push to main</text>

  <!-- Right box: terraform-managed resources -->
  <rect x="590" y="270" width="290" height="80" rx="8" fill="#ffffff" stroke="#7B42BC" stroke-width="2"/>
  <text x="735" y="292" text-anchor="middle" fill="#232f3e" font-size="13" font-weight="bold">All AWS Infrastructure</text>
  <text x="735" y="311" text-anchor="middle" fill="#5c6773" font-size="11">S3 &#183; CloudFront &#183; Lambda &#183; DynamoDB</text>
  <text x="735" y="327" text-anchor="middle" fill="#5c6773" font-size="11">Route53 &#183; ACM</text>
  <text x="735" y="343" text-anchor="middle" fill="#5c6773" font-size="10" font-style="italic">provisioned and updated by Terraform</text>

  <g font-size="11" fill="#5c6773">
    <line x1="510" y1="360" x2="540" y2="360" stroke="#5c6773" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="548" y="364">content sync</text>

    <line x1="620" y1="360" x2="650" y2="360" stroke="#7B42BC" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="658" y="364">infrastructure (Terraform-managed)</text>
  </g>
</svg>
